name: CD (Publish to npm)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type. Use none after a release-prep PR on protected main."
        required: true
        type: choice
        default: none
        options:
          - patch
          - minor
          - major
          - none
      preid:
        description: "Pre-release id (e.g. beta, rc). Leave blank for stable"
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  pull-requests: write

concurrency:
  group: npm-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  FALLBACK_RUNNER_LABEL: ubuntu-latest
  SELF_HOSTED_RUNNER_LABELS: '["self-hosted","Linux","X64"]'

jobs:
  prepare_release:
    uses: ./.github/workflows/release-prepare.yml
    with:
      bump: ${{ inputs.bump }}
      preid: ${{ inputs.preid }}
    secrets: inherit

  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    outputs:
      runner_labels: ${{ steps.select.outputs.runner_labels }}
    steps:
      - name: Prefer idle self-hosted runner
        id: select
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.RUNNER_SELECTOR_TOKEN || github.token }}
          script: |
            const selfHostedLabels = JSON.parse(process.env.SELF_HOSTED_RUNNER_LABELS)
            const fallbackRunner = process.env.FALLBACK_RUNNER_LABEL
            let selectedRunnerJson = JSON.stringify(fallbackRunner)

            try {
              const runners = await github.paginate(
                github.rest.actions.listSelfHostedRunnersForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                }
              )

              const hasMatchingIdleRunner = runners.some((runner) => {
                const labels = new Set((runner.labels || []).map((label) => label.name))
                return (
                  runner.status === "online" &&
                  runner.busy === false &&
                  selfHostedLabels.every((label) => labels.has(label))
                )
              })

              if (hasMatchingIdleRunner) {
                selectedRunnerJson = JSON.stringify(selfHostedLabels)
                core.info(`Selected self-hosted runner labels ${selfHostedLabels.join(", ")}.`)
              } else {
                core.info(
                  `No idle self-hosted runner with labels ${selfHostedLabels.join(", ")} was found; falling back to ${fallbackRunner}.`
                )
              }
            } catch (error) {
              core.warning(
                `Could not inspect self-hosted runners; falling back to ${fallbackRunner}. ${error.message}`
              )
            }

            core.setOutput("runner_labels", selectedRunnerJson)

  publish:
    needs:
      - select-runner
      - prepare_release
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit --legacy-peer-deps || npm install --no-fund --no-audit --legacy-peer-deps

      - name: Test
        run: npm run test

      - name: Use prepared release metadata
        id: release
        run: |
          set -euo pipefail

          FLAGS="${{ needs.prepare_release.outputs.flags }}"
          PACKAGE_ACCESS=""
          if [ "${FLAGS}" = "--access public" ]; then
            PACKAGE_ACCESS="public"
          fi

          PUBLISHED="${{ needs.prepare_release.outputs.published }}"
          SHOULD_PUBLISH="true"
          SKIP_REASON=""
          if [ "${PUBLISHED}" = "true" ]; then
            SHOULD_PUBLISH="false"
            SKIP_REASON="Package version ${{ needs.prepare_release.outputs.version }} is already published; nothing to release."
          fi

          {
            echo "package_name=${{ needs.prepare_release.outputs.name }}"
            echo "package_access=${PACKAGE_ACCESS}"
            echo "release_version=${{ needs.prepare_release.outputs.version }}"
            echo "release_tag=${{ needs.prepare_release.outputs.tag }}"
            echo "should_publish=${SHOULD_PUBLISH}"
            echo "skip_reason=${SKIP_REASON}"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.release.outputs.should_publish == 'true'
        run: npm run build --if-present

      - name: Generate SBOM (CycloneDX)
        if: steps.release.outputs.should_publish == 'true'
        run: npm sbom --sbom-format=cyclonedx --sbom-type=library --omit dev > sbom.cdx.json
        continue-on-error: true

      - name: Attest SBOM
        if: ${{ hashFiles('sbom.cdx.json') != '' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: sbom.cdx.json

      - name: Create release tag from main
        if: steps.release.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout -B main origin/main

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            if gh release view "${TAG}" >/dev/null 2>&1; then
              IS_DRAFT="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
              if [ "${IS_DRAFT}" != "true" ]; then
                echo "Published release ${TAG} already exists; reusing the existing tag."
                exit 0
              fi
            fi

            echo "Deleting stale unpublished tag ${TAG} before recreating it from main."
            git push origin ":refs/tags/${TAG}"
          fi

          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release draft (immutable-safe)
        if: steps.release.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $TAG already exists and is published. Immutable releases cannot be modified after publication; cut a new version instead."
              exit 1
            fi

            echo "Draft release $TAG already exists; refreshing mutable assets."
            if [ -s sbom.cdx.json ]; then
              gh release upload "$TAG" sbom.cdx.json --clobber
            else
              echo "Skipping SBOM release upload (file missing or empty)."
            fi
          else
            if [ -s sbom.cdx.json ]; then
              gh release create "$TAG" sbom.cdx.json --title "Release $TAG" --generate-notes --verify-tag --draft
            else
              gh release create "$TAG" --title "Release $TAG" --generate-notes --verify-tag --draft
            fi
          fi

      - name: Publish to npm
        if: steps.release.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_ACCESS: ${{ steps.release.outputs.package_access }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required" >&2
            exit 1
          fi

          if [ "${PACKAGE_ACCESS}" = "public" ]; then
            npm publish --access public --provenance --registry https://registry.npmjs.org
          else
            npm publish --provenance --registry https://registry.npmjs.org
          fi

      - name: Publish GitHub Release
        if: steps.release.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Expected draft release $TAG to exist before publication."
            exit 1
          fi

          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [ "$IS_DRAFT" = "true" ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            echo "Release $TAG is already published; skipping publication."
          fi
